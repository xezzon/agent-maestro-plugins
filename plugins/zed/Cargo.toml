[package]
name = "maestro-plugin-zed"
version = "0.1.0"
edition.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
maestro-plugin-sdk = { workspace = true }
# cst feature 非默认开启：只有 CST API 能保留 settings.json 中的注释与格式。
jsonc-parser = { version = "0.33", features = ["cst"] }
